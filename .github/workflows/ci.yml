name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python Scripts/check-repository.py
      - run: python -m unittest discover -s tests -v
        working-directory: Windows
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make app
      - uses: actions/upload-artifact@v4
        with:
          name: InterviewProducer-macOS
          path: dist/InterviewProducer-macOS.zip
          retention-days: 14
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: Windows/requirements*.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m interview_producer --smoke-test
      - run: python -m PyInstaller --noconfirm --clean --windowed --name InterviewProducer --collect-all keyring --collect-all pyaudiowpatch launcher.py
      - name: Verify packaged application starts and saves
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/InterviewProducer/InterviewProducer.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged app smoke test failed: $($process.ExitCode)" }
      - name: Add license and instructions
        shell: pwsh
        run: |
          Copy-Item ../LICENSE dist/InterviewProducer/LICENSE.txt
          Copy-Item README.md dist/InterviewProducer/README.md
          Compress-Archive -Path dist/InterviewProducer -DestinationPath dist/InterviewProducer-Windows-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: InterviewProducer-Windows-preview
          path: Windows/dist/InterviewProducer-Windows-preview.zip
          retention-days: 14
